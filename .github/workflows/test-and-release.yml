name: Test and release DataWeave library

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test every library function
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run DataWeave unit tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dataweave-test-reports
          path: target/data-weave-test-reports/
          if-no-files-found: warn

  package:
    name: Package reusable library
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: mvn --batch-mode --no-transfer-progress org.codehaus.mojo:versions-maven-plugin:2.20.1:set -DnewVersion="${RELEASE_VERSION#v}" -DgenerateBackupPoms=false

      - name: Package library
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Upload packaged library
        uses: actions/upload-artifact@v7
        with:
          name: dwdash-library
          path: target/*.jar
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged library
        uses: actions/download-artifact@v8
        with:
          name: dwdash-library
          path: release-assets

      - name: Create release and attach JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*.jar --verify-tag --generate-notes --title "dwdash ${GITHUB_REF_NAME}"
