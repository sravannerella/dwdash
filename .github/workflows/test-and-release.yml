name: Test and release DataWeave library

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing release version to publish to Maven Central (for example, 0.1.1)
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test every library function
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run DataWeave unit tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dataweave-test-reports
          path: target/data-weave-test-reports/
          if-no-files-found: warn

  package:
    name: Package reusable library
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_version }}
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          mvn --batch-mode --no-transfer-progress org.codehaus.mojo:versions-maven-plugin:2.20.1:set -DnewVersion="$version" -DgenerateBackupPoms=false

      - name: Package library
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Upload packaged library
        uses: actions/upload-artifact@v7
        with:
          name: dwdash-library
          path: target/*.jar
          if-no-files-found: error


  publish-central:
    name: Publish to Maven Central
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java, Maven Central, and GPG
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE

      - name: Set release version
        id: release-version
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_version }}
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mvn --batch-mode --no-transfer-progress org.codehaus.mojo:versions-maven-plugin:2.20.1:set -DnewVersion="$version" -DgenerateBackupPoms=false

      - name: Build signed Maven Central bundle
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -Pcentral -DskipTests -DskipDeployDocs=true deploy

      - name: Correct DataWeave classifier signature
        run: scripts/build-central-bundle.sh "${{ steps.release-version.outputs.version }}"

      - name: Publish bundle to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: scripts/publish-central.sh target/central-publishing/central-bundle.zip "dwdash ${{ steps.release-version.outputs.version }}"

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged library
        uses: actions/download-artifact@v8
        with:
          name: dwdash-library
          path: release-assets

      - name: Create release and attach JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*.jar --verify-tag --generate-notes --title "dwdash ${GITHUB_REF_NAME}"
